name: Deploy

# Depuis main : chaque push deploie automatiquement.
# Depuis n'importe quelle branche : bouton "Run workflow" dans l'onglet Actions
# de GitHub (utilisable depuis un telephone).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux pushes rapproches ne se marchent pas dessus.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Installer les dependances du front
        run: npm ci

      - name: Installer les dependances des fonctions
        # firebase-tools analyse les triggers en local avant de deployer :
        # sans ces paquets, il ne peut pas charger functions/index.js.
        run: npm ci --prefix functions

      - name: Restaurer les variables de build
        # Le front lit ses VITE_* au moment du build : sans ce fichier,
        # l'app compilee ne sait pas a quel projet Firebase se connecter.
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

      - name: Verifier le code
        run: npm run lint

      - name: Construire le front
        run: npm run build

      - name: S'authentifier aupres de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deployer
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 60
        run: npx firebase-tools@14 deploy --only functions,hosting --project suivi-cours-ilm --non-interactive
